<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 125 36" width="125" height="36" role="img" aria-label="Salesforce"><style>
.a1{opacity:0;animation:fade 1s ease-out .2s forwards}
.a2{opacity:0;animation:rise 1.2s cubic-bezier(.2,.7,.2,1) .5s forwards;transform-box:fill-box}
.a3{opacity:0;animation:fade 1.2s ease-out 2.6s forwards}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease-in-out 1.3s forwards}
.late{animation-delay:2.1s}
@keyframes fade{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important;transform:none!important}}
</style>
